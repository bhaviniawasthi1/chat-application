spring.application.name=SyncTalk

server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:synctalk_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
